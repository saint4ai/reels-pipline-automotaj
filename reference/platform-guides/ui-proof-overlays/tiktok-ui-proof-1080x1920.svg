    <circle cx="72" cy="104" r="30"/>
    <line x1="126" y1="104" x2="266" y2="104"/>
    <line x1="386" y1="104" x2="526" y2="104"/>
    <line x1="378" y1="144" x2="534" y2="144" stroke="#FE2C55"/>
