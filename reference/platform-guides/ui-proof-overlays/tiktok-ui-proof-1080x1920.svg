  <text x="856" y="402" class="micro" fill="#FFFFFF">PROFILE</text>
  <text x="856" y="427" class="micro" fill="#FFFFFF">HEART / COMMENT</text>
  <text x="856" y="452" class="micro" fill="#FFFFFF">BOOKMARK / SHARE</text>

