  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" class="line">
    <circle cx="960" cy="500" r="48"/>
    <line x1="938" y1="562" x2="982" y2="562" stroke="#FE2C55" stroke-width="12"/>
    <line x1="960" y1="540" x2="960" y2="584" stroke="#FE2C55" stroke-width="12"/>
    <path d="M960 634 C920 598 870 652 902 694 L960 750 L1018 694 C1050 652 1000 598 960 634 Z"/>
    <path d="M905 785 C905 750 930 728 960 728 C990 728 1015 750 1015 785 C1015 820 990 842 960 842 L932 865 L938 834 C918 825 905 807 905 785 Z"/>
    <path d="M925 900 L995 900 L995 1000 L960 978 L925 1000 Z"/>
    <path d="M900 1070 L1020 1024 L980 1144 L950 1094 Z"/>
    <line x1="950" y1="1094" x2="1020" y2="1024"/>
