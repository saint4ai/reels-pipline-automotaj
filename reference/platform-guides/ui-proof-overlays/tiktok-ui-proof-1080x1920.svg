    <line x1="112" y1="1660" x2="566" y2="1660" stroke-width="5"/>
    <line x1="40" y1="1800" x2="1040" y2="1800" stroke-width="4"/>
    <path d="M94 1860 L124 1838 L154 1860 L154 1896 L94 1896 Z"/>
    <path d="M420 1844 C394 1844 382 1862 382 1880 C382 1898 398 1908 420 1908"/>
    <rect x="500" y="1838" width="80" height="70" rx="16" stroke="#25F4EE"/>
    <line x1="540" y1="1852" x2="540" y2="1894"/>
    <line x1="518" y1="1873" x2="562" y2="1873"/>
    <circle cx="770" cy="1872" r="30"/>
    <circle cx="970" cy="1872" r="30"/>
  </g>
  <text x="42" y="1410" class="label" fill="#FFFFFF">BOTTOM USERNAME / CAPTION / MUSIC / NAV</text>

  <g>
    <rect x="138" y="286" width="500" height="48" rx="9" fill="#C7FF00"/>
    <text x="158" y="318" fill="#111214" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="1.4">SAFE X 120-840 / Y 260-1360</text>
    <rect x="42" y="1728" width="660" height="48" rx="9" fill="#111214"/>
    <text x="62" y="1760" class="label" fill="#FFFFFF">TIKTOK UI PROOF · QA ONLY · DO NOT EXPORT</text>
  </g>
