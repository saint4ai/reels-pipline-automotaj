  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" class="line">
    <line x1="46" y1="1450" x2="360" y2="1450"/>
    <line x1="46" y1="1500" x2="724" y2="1500" stroke-width="5"/>
    <line x1="46" y1="1538" x2="608" y2="1538" stroke-width="5"/>
    <line x1="46" y1="1576" x2="468" y2="1576" stroke-width="5"/>
    <circle cx="74" cy="1660" r="18"/>
