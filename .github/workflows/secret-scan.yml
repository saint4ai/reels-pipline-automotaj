name: secret-scan

# Публичный репозиторий: любой может прислать pull request. Проверяем каждый пуш и каждый PR
# тем же скриптом, что стоит в хуке перед коммитом, — одно правило на все входы.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна вся история, а не последний коммит
      - name: Дерево
        run: bash scripts/check-secrets.sh
      - name: История
        run: bash scripts/check-secrets.sh --history
